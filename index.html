<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกม 24</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#fff1e0;--bg2:#ffd9e8;--card:rgba(255,255,255,.75);--ink:#2b2340;--mut:#7d7494;--line:rgba(80,60,120,.15);
--c1:#ff7a59;--c2:#ffb020;--c3:#31c48d;--c4:#4f8cff;--acc:#7c4dff;--ok:#1f9d6b;--bad:#e5484d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1c1533;--bg2:#2a1740;--card:rgba(255,255,255,.08);--ink:#f4efff;--mut:#a89fc4;--line:rgba(255,255,255,.14);--ok:#4be0a0;--bad:#ff7b80}}
:root[data-theme="dark"]{--bg1:#1c1533;--bg2:#2a1740;--card:rgba(255,255,255,.08);--ink:#f4efff;--mut:#a89fc4;--line:rgba(255,255,255,.14);--ok:#4be0a0;--bad:#ff7b80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Prompt","Noto Sans Thai",system-ui,sans-serif;display:flex;justify-content:center;padding:18px 16px 28px}
.app{width:100%;max-width:440px}
.title{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 4px}
.title h1{margin:0;font-size:30px;letter-spacing:.5px}
.badge{background:linear-gradient(135deg,var(--c1),var(--acc));color:#fff;font-weight:700;font-size:26px;padding:2px 14px;border-radius:14px;box-shadow:0 6px 16px rgba(124,77,255,.35)}
.sub{text-align:center;color:var(--mut);margin:0 0 16px;font-size:13.5px;line-height:1.5}
.stats{display:flex;gap:8px;margin-bottom:16px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center;backdrop-filter:blur(8px)}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.num{height:96px;font-family:inherit;font-size:38px;font-weight:700;color:#fff;border:0;border-radius:22px;cursor:pointer;
box-shadow:0 8px 0 rgba(0,0,0,.18),0 12px 22px rgba(0,0,0,.12);transition:transform .12s,box-shadow .12s,filter .12s;position:relative}
.num:nth-child(1){background:linear-gradient(145deg,#ff8a6b,var(--c1))}
.num:nth-child(2){background:linear-gradient(145deg,#ffc94d,var(--c2))}
.num:nth-child(3){background:linear-gradient(145deg,#52d9a6,var(--c3))}
.num:nth-child(4){background:linear-gradient(145deg,#74a5ff,var(--c4))}
.num:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.num.sel{transform:translateY(-4px) scale(1.04);box-shadow:0 0 0 4px #fff,0 0 0 8px var(--acc),0 14px 26px rgba(124,77,255,.4)}
.num.gone{visibility:hidden}
.num.pop{animation:pop .35s}
.num.shake{animation:shake .4s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0 12px}
.op{height:58px;font-family:inherit;font-size:28px;font-weight:600;color:var(--acc);background:var(--card);border:2px solid var(--line);border-radius:18px;cursor:pointer;backdrop-filter:blur(8px);transition:.12s}
.op:active{transform:scale(.93)}
.op.sel{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 8px 20px rgba(124,77,255,.4);transform:translateY(-2px)}
.msg{min-height:34px;text-align:center;font-size:17px;font-weight:600;margin:4px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.hist{min-height:64px;font-size:14px;color:var(--mut);text-align:center;margin-bottom:10px;line-height:1.7}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{padding:12px 4px;font-size:14px;font-family:inherit;font-weight:600;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;backdrop-filter:blur(8px)}
.btn:active{transform:scale(.95)}
.btn.main{grid-column:1/-1;padding:15px;font-size:16px;color:#fff;border:0;background:linear-gradient(135deg,var(--c1),var(--acc));box-shadow:0 8px 20px rgba(124,77,255,.35)}
.conf{position:fixed;top:-12px;width:10px;height:14px;border-radius:2px;pointer-events:none;animation:fall 1.8s ease-in forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.8}}
</style>
</head>
<body>
<div class="app">
  <div class="title"><h1>เกม</h1><span class="badge">24</span></div>
  <p class="sub">ใช้ + − × ÷ กับเลขทั้ง 4 ตัว (ใช้ครบทุกตัว ตัวละครั้งเดียว) ให้ได้ 24</p>
  <div class="stats"><div class="stat"><b id="win">0</b><span>🏆 ชนะ</span></div><div class="stat"><b id="streak">0</b><span>🔥 ติดต่อกัน</span></div><div class="stat"><b id="hints">0</b><span>💡 ดูเฉลย</span></div></div>
  <div class="grid" id="grid"></div>
  <div class="ops" id="ops"></div>
  <div class="msg" id="msg"></div>
  <div class="hist" id="hist"></div>
  <div class="row">
    <button class="btn" id="undo">↩ ย้อนกลับ</button>
    <button class="btn" id="reset">🔄 เริ่มใหม่</button>
    <button class="btn" id="hint">💡 เฉลย</button>
    <button class="btn main" id="next">✨ โจทย์ใหม่</button>
  </div>
</div>
<script>
const EPS=1e-6, OPS=['+','−','×','÷'];
let popIdx=-1, items, history, selA, selOp, orig, solution, solved, win=0, streak=0, hints=0;

function fmt(v){
  if(Math.abs(v-Math.round(v))<EPS) return String(Math.round(v));
  for(let d=2;d<=12;d++){const n=v*d; if(Math.abs(n-Math.round(n))<EPS) return Math.round(n)+'/'+d;}
  return v.toFixed(2);
}
function apply(a,b,op){
  if(op==='+') return a+b; if(op==='−') return a-b; if(op==='×') return a*b;
  return Math.abs(b)<EPS?null:a/b;
}
function solve(arr){
  if(arr.length===1) return Math.abs(arr[0].v-24)<EPS?arr[0].e:null;
  for(let i=0;i<arr.length;i++)for(let j=0;j<arr.length;j++){
    if(i===j) continue;
    const rest=arr.filter((_,k)=>k!==i&&k!==j);
    for(const op of OPS){
      if((op==='+'||op==='×')&&i>j) continue;
      const v=apply(arr[i].v,arr[j].v,op); if(v===null) continue;
      const r=solve([...rest,{v,e:'('+arr[i].e+' '+op+' '+arr[j].e+')'}]);
      if(r) return r;
    }
  }
  return null;
}
function newPuzzle(){
  let nums,sol;
  do{ nums=Array.from({length:4},()=>1+Math.floor(Math.random()*9));
      sol=solve(nums.map(n=>({v:n,e:String(n)}))); }while(!sol);
  orig=nums; solution=sol.replace(/^\((.*)\)$/,'$1'); reset();
}
function reset(){
  items=orig.map(n=>({v:n,e:String(n)})); history=[]; selA=null; selOp=null; solved=false;
  msg(''); render();
}
function confetti(){const cs=['#ff7a59','#ffb020','#31c48d','#4f8cff','#7c4dff'];for(let i=0;i<60;i++){const d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=cs[i%5];d.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2500);}}
function msg(t,c){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+(c||'');}
function render(){
  const g=document.getElementById('grid'); g.innerHTML='';
  items.forEach((it,i)=>{
    const b=document.createElement('button');
    b.className='num'+(it===null?' gone':'')+(selA===i?' sel':'')+(popIdx===i?' pop':'');
    if(it) b.innerHTML=fmt(it.v);
    b.onclick=()=>clickNum(i); g.appendChild(b);
  });
  const o=document.getElementById('ops'); o.innerHTML='';
  OPS.forEach(op=>{
    const b=document.createElement('button');
    b.className='op'+(selOp===op?' sel':''); b.textContent=op;
    b.onclick=()=>{ if(selA===null||solved) return; selOp=selOp===op?null:op; render(); };
    o.appendChild(b);
  });
  document.getElementById('hist').innerHTML=history.map(h=>h.step).join('<br>');
  document.getElementById('win').textContent=win;
  document.getElementById('streak').textContent=streak;
  document.getElementById('hints').textContent=hints;
}
function clickNum(i){
  if(solved||!items[i]) return;
  if(selA===null){selA=i;render();return;}
  if(selA===i){selA=null;selOp=null;render();return;}
  if(selOp===null){selA=i;render();return;}
  const a=items[selA],b=items[i],v=apply(a.v,b.v,selOp);
  if(v===null){msg('หารด้วย 0 ไม่ได้!','bad');return;}
  history.push({items:items.slice(),step:`${fmt(a.v)} ${selOp} ${fmt(b.v)} = ${fmt(v)}`});
  items[i]={v,e:''}; items[selA]=null; popIdx=i; selA=null; selOp=null;
  const left=items.filter(Boolean);
  if(left.length===1){
    if(Math.abs(left[0].v-24)<EPS){solved=true;win++;streak++;msg('🎉 ถูกต้อง! ได้ 24 แล้ว','ok');confetti();}
    else{streak=0;msg('ได้ '+fmt(left[0].v)+' ไม่ใช่ 24 ลองย้อนกลับดูนะ','bad');setTimeout(()=>document.querySelectorAll('.num:not(.gone)').forEach(n=>n.classList.add('shake')),30);}
  } else msg('');
  render(); popIdx=-1;
}
document.getElementById('undo').onclick=()=>{
  if(!history.length) return; items=history.pop().items; selA=selOp=null; solved=false; msg(''); render();
};
document.getElementById('reset').onclick=reset;
document.getElementById('next').onclick=newPuzzle;
document.getElementById('hint').onclick=()=>{ if(!solved){hints++;streak=0;} msg('เฉลย: '+solution+' = 24','ok'); render(); };
newPuzzle();
</script>
</body>
</html>
